<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #0B1120;
    color: #F1F5F9;
    position: relative;
  }
  .glow {
    position: absolute;
    top: -220px; right: -160px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(13,148,136,0.30), transparent 68%);
    border-radius: 50%;
  }
  .glow2 {
    position: absolute;
    bottom: -300px; left: -200px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(94,234,212,0.10), transparent 70%);
    border-radius: 50%;
  }
  .wrap {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand-mark {
    width: 60px; height: 60px;
    background: #0D9488;
    border-radius: 16px;
    display: grid; place-items: center;
    box-shadow: 0 12px 30px -8px rgba(13,148,136,0.6);
  }
  .brand-name {
    font-size: 34px; font-weight: 800; letter-spacing: -1px; color: #fff;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 4px;
    color: #5EEAD4;
    margin-bottom: 26px;
    display: flex; align-items: center; gap: 12px;
  }
  .eyebrow .dot { width: 9px; height: 9px; background: #5EEAD4; border-radius: 50%; }
  h1 {
    font-size: 76px; font-weight: 800; line-height: 1.02; letter-spacing: -2.5px;
    max-width: 920px; color: #F8FAFC;
  }
  h1 em { font-style: italic; font-weight: 400; color: #2DD4BF; }
  .footer-row {
    display: flex; align-items: center; gap: 22px;
    font-size: 22px; color: #94A3B8; font-weight: 500;
  }
  .pill {
    background: rgba(13,148,136,0.16);
    border: 1px solid rgba(94,234,212,0.35);
    color: #5EEAD4;
    padding: 10px 20px; border-radius: 999px;
    font-size: 19px; font-weight: 600;
  }
  .sep { color: #334155; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" fill="#fff" stroke="#fff"/></svg>
      </div>
      <div class="brand-name">OwnerDeck</div>
    </div>

    <div>
      <div class="eyebrow"><span class="dot"></span>WhatsApp booking assistant · Cyprus</div>
      <h1>Never lose a booking to <em>a slow reply.</em></h1>
    </div>

    <div class="footer-row">
      <span class="pill">Live in 48 hours</span>
      <span>Instant replies, 24/7, in your customer's language</span>
    </div>
  </div>
</body>
</html>
